[project]
name = "pinet"
version = "0.1.0"
description = "Decoding a hierarchy of dynamic neural codes for typing from MEG/EEG (PiNet study)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "levenshtein>=0.27.3",
    "neuralset",
    "pip>=25.3",
    "seaborn>=0.13.2",
    "spacy>=3.8.11",
    # the Spanish spaCy model used for the paper (word embeddings)
    "es-core-news-lg @ https://github.com/explosion/spacy-models/releases/download/es_core_news_lg-3.8.0/es_core_news_lg-3.8.0-py3-none-any.whl",
    "spacy-syllables>=3.0.2",
    "transformers>=5.3.0",
    "fasttext>=0.9.3",
    "colorcet>=3.1.0",
    "torch==2.4",
    "exca==0.2.3",
    "xarray>=2026.2.0",
]

[tool.uv.sources]
neuralset = { path = "third_party/neuralset", editable = true }

[dependency-groups]
dev = ["pytest>=7.4.0"]
