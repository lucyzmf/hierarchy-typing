[project]
name = "neuralset"
readme = "README.md"
authors = [{name = "Meta FAIR"}]
requires-python = ">=3.10"
version = "0.0.1"

dependencies = [
  "pandas>=2.2.2",
  "numpy==1.26.4",  # temporary until compatibility is back with torch
  "pyarrow>=17.0.0",
  "mne>=1.4.0",
  "pybv>=0.7.6",
  "scikit-learn>=0.21.2",
  "torch==2.4",  # temporary until compatibility is back with numpy
  "tqdm>=4.65.0",
  "exca>=0.2.3",
]

[project.urls]
  Source = "https://github.com/facebookresearch/neuroai"
  Tracker = "https://github.com/facebookresearch/neuroai/issues"

[project.optional-dependencies]
    dev = [
        "pytest>=4.3.0",
    ]

[tool.black]
line-length = 90
exclude = '''
/(
  | \.git
  | \.mypy_cache
)/
'''
force-exclude = '''
/(
   scratch
)\
'''

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["neuralset*"]  # package names should match these glob patterns (["*"] by default)
exclude = []  # exclude packages matching these glob patterns (empty by default)
namespaces = false  # to disable scanning PEP 420 namespaces (true by default)

[tool.setuptools.package-data]
# not sufficient in editable mode: https://github.com/python/mypy/issues/13392
# still need to install with: pip install --config-settings editable_mode=strict -e .
"neuralset" = ["py.typed", ".pyi"]

[tool.isort]
profile = "black"
line_length = 90
skip_gitignore = true

[tool.pylint]
  [tool.pylint."MESSAGES CONTROL"]
  # disabled messages
  # * no-member has a lot of false positive, mypy does it better
  disable = """
      broad-except,
      fixme,
      invalid-name,
      logging-fstring-interpolation,
      missing-docstring,
      no-else-return,
      no-member,
      protected-access,
      too-few-public-methods,
      too-many-locals,
      too-many-statements,
      too-many-return-statements,
      too-many-branches,
      useless-import-alias,
      unspecified-encoding,
      use-dict-literal,
      useless-import-alias,
      import-outside-toplevel
  """
  [tool.pylint.DESIGN]
  max-args = 6

  [tool.pylint.FORMAT]
  max-line-length = "140"

  [tool.pylint.SIMILARITIES]
  ignore-imports = "yes"


[tool.mypy]
  plugins = ['pydantic.mypy']
  show_error_codes = true
[[tool.mypy.overrides]]
  # we bluntly override the input type for _get in the features
  module = ['neuralset.features.*']
  disable_error_code = ['override']
[[tool.mypy.overrides]]
  module = ['pytest', 'setuptools', 'mne', 'mne.io', 'mne.io.brainvision', 'spacy', 'spacy.cli',
  'transformers', 'sklearn.*', 'scipy.*', 'exca', 'pyarrow', 'pybv']
  ignore_missing_imports = true


[tool.pydantic-mypy]
  init_forbid_extra = true
  init_typed = true
  warn_required_dynamic_aliases = true
